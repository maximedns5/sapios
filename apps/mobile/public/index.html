<!doctype html>
<html lang="fr">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <title>Sapios</title>
    <!-- App membre non référencée : la landing garde la liste d'attente. -->
    <meta name="robots" content="noindex, nofollow" />
    <meta name="googlebot" content="noindex, nofollow" />
    <meta name="referrer" content="strict-origin-when-cross-origin" />
    <meta name="theme-color" content="#FFFFFF" />
    <meta name="color-scheme" content="light" />
    <meta name="apple-mobile-web-app-title" content="Sapios" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="default" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <link rel="manifest" href="/manifest.webmanifest" />
    <style id="expo-reset">
      html,
      body {
        height: 100%;
        margin: 0;
        background: #ffffff;
      }
      body {
        overflow: hidden;
        overscroll-behavior: none;
      }
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
      noscript {
        display: block;
        padding: 24px;
        color: #1a1918;
        font: 16px/1.5 system-ui, sans-serif;
      }
      /* Logo de démarrage : affiché avant le chargement du script, remplacé par l'app au premier rendu. */
      #boot {
        flex: 1;
        display: flex;
        align-items: center;
        justify-content: center;
        background: #ffffff;
        color: #1a1918;
        font: italic 500 44px/1 'Bodoni Moda', Georgia, 'Times New Roman', serif;
        letter-spacing: -0.01em;
      }
    </style>
  </head>

  <body>
    <noscript>Sapios demande JavaScript. Activez-le pour continuer.</noscript>
    <div id="root"><div id="boot" aria-label="Sapios">sapios</div></div>
  </body>
</html>
